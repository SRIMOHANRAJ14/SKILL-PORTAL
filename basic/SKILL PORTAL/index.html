<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />

    <link rel="stylesheet" href="./global.css" />
    <link rel="stylesheet" href="./index.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;1,400;1,500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Avenir:wght@400&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;900&display=swap"
    />
  </head>
  <body>
    <div class="typeoflogin">
      <main class="image">
        <div class="signup">
          <div class="signup-container">
            <div class="signup-inner-container">
              <div class="signup-spacing-container">
                <div class="signup-content-container">
                  <div class="signup-welcome-container">
                    <img
                      class="image-11-icon"
                      loading="lazy"
                      alt=""
                      src="./public/image-11@2x.png"
                    />

                    <i class="welcome-to-training-container">
                      <p class="welcome-to-training">Welcome to Skill Training Portal</p>
                    </i>
                  </div>
                </div>
              </div>
              <div class="login-container">
                <div class="have-an-account-login">
                  <i class="already-have-an">Log in as</i>
                </div>
              </div>
              <div class="signup-inner-container-inner">
                <button class="rectangle-parent" id="groupButton">
                  <div class="frame-child"></div>
                  <img
                    class="management-icon"
                    alt=""
                    src="./public/management@2x.png"
                  />

                  <div class="admin-label">
                    <i class="admin">ADMIN</i>
                  </div>
                </button>
              </div>
              <div class="roles-container-wrapper">
                <div class="roles-container">
                  <div class="roles-container-inner">
                    <button class="rectangle-group" id="groupButton1">
                      <div class="frame-item"></div>
                      <div class="management"></div>
                      <img
                        class="student-male-icon"
                        alt=""
                        src="./public/student-male@2x.png"
                      />

                      <div class="student-label">
                        <i class="student">STUDENT</i>
                      </div>
                    </button>
                  </div>
                  <div class="parent" id="parentContainer">
                    <div class="rectangle-container">
                      <div class="frame-item"></div>
                      <img
                        class="student-male-icon"
                        loading="lazy"
                        alt=""
                        src="./public/user-account@2x.png"
                      />

                      <div class="faculty-label">
                        <i class="faculity">FACULITY</i>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <img class="icons" loading="lazy" alt="" src="./public/icons.svg" />

          <div class="content"></div>
        </div>
      </main>
    </div>

    <script>
      var groupButton = document.getElementById("groupButton");
      if (groupButton) {
        groupButton.addEventListener("click", function (e) {
          window.location.href = "./login.html";
        });
      }
      
      var groupButton1 = document.getElementById("groupButton1");
      if (groupButton1) {
        groupButton1.addEventListener("click", function (e) {
          window.location.href = "./login.html";
        });
      }
      
      var parentContainer = document.getElementById("parentContainer");
      if (parentContainer) {
        parentContainer.addEventListener("click", function (e) {
          window.location.href = "./desktop2.html";
        });
      }
      </script>
  </body>
</html>
