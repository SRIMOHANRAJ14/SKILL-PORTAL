<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />

    <link rel="stylesheet" href="./global.css" />
    <link rel="stylesheet" href="./login.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;1,400;1,500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Avenir:wght@400&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;900&display=swap"
    />
  </head>
  <body>
    <div class="login">
      <main class="image1">
        <div class="sign-up-overlay">
          <div class="signup-container1">
            <form class="credentials">
              <div class="welcome-content-wrapper">
                <div class="welcome-content">
                  <img
                    class="image-11-icon1"
                    loading="lazy"
                    alt=""
                    src="./public/image-11@2x.png"
                  />

                  <h3 class="welcome-to-training-container1">
                    <p class="welcome-to-training1">Welcome to Skill Portal</p>
                    <p class="welcome-to-training1">Performance tracker</p>
                  </h3>
                  <div class="have-an-account-login1">
                    <div class="already-have-an1">Sign up to see more</div>
                  </div>
                </div>
              </div>
              <div class="username-input">
                <div class="password-input">
                  <input
                    class="username"
                    placeholder="   Username "
                    type="text"
                  />
                </div>
              </div>
              <div class="username-input">
                <div class="password-input">
                  <input
                    class="username"
                    placeholder="   Password "
                    type="text"
                  />
                </div>
              </div>
              <div class="login-buttons">
                <div class="login-button-container">
                  <div class="login-actions">
                    <div class="login-action">
                      <button class="login-button-label">
                        <div class="login1">
                          <span class="span"> </span>
                          <span class="login2">Login</span>
                        </div>
                      </button>
                    </div>
                    <div class="forget-password">Forget password ?</div>
                  </div>
                  <div class="div">---------------------------------</div>
                </div>
              </div>
              <div class="social-login">
                <div class="social-login-container" id="socialLoginContainer">
                  <div class="social-media-signuplogin">
                    <div class="google-login">
                      <div class="google-button">
                        <img
                          class="social-media-logo"
                          loading="lazy"
                          alt=""
                          src="./public/social-media-logo.svg"
                        />
                      </div>
                      <div class="continue-with-google">
                        Continue with Google
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="signup-prompt">
                <div class="have-an-account-login2" id="haveAnAccountLogin">
                  <div class="already-have-an-container">
                    <span class="already">Already</span>
                    <span class="span1"> </span>
                    <span class="already">a</span>
                    <span class="span1"> </span>
                    <span class="already">remember?</span>
                    <span class="span3"> </span>
                    <span class="log-in">Log in </span>
                  </div>
                </div>
              </div>
            </form>
          </div>
          <img class="icons1" loading="lazy" alt="" src="./public/icons.svg" />
        </div>
      </main>
    </div>

    <script>
      var socialLoginContainer = document.getElementById("socialLoginContainer");
      if (socialLoginContainer) {
        socialLoginContainer.addEventListener("click", function (e) {
          window.location.href = "./desktop.html";
        });
      }
      
      var haveAnAccountLogin = document.getElementById("haveAnAccountLogin");
      if (haveAnAccountLogin) {
        haveAnAccountLogin.addEventListener("click", function (e) {
          window.location.href = "./typeof-login.html";
        });
      }
      </script>
  </body>
</html>
